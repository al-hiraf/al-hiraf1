<style>
:root{
  --navy:#1d2d3a; --navy-2:#26394b; --orange:#df7d34; --orange-ink:#b8561a;
  --paper:#eef1f4; --surface:#ffffff; --line:#d7dee6; --ink:#16232f; --muted:#5b6977; --grid:rgba(29,45,58,.06);
  --on-dark:#eef3f7; --hero-muted:#b9c7d4;
  --display:'Alexandria','Tajawal','Segoe UI',Tahoma,sans-serif; --body:'Tajawal','Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0e151c;--surface:#15202b;--line:#253444;--ink:#e6edf3;--muted:#9fb0c0;--grid:rgba(143,169,194,.07);--orange-ink:#f0914f;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0e151c;--surface:#15202b;--line:#253444;--ink:#e6edf3;--muted:#9fb0c0;--grid:rgba(143,169,194,.07);--orange-ink:#f0914f;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{width:min(1120px,100%);margin-inline:auto;padding-inline:20px}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}
/* الرأس */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:68px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .mark{background:#fff;border-radius:10px;padding:5px 7px;display:flex;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.brand img{height:30px;width:auto;display:block}
.brand b{font-family:var(--display);font-weight:700;font-size:17px}
nav.links{display:flex;gap:18px;margin-inline-start:auto;flex-wrap:wrap}
nav.links a{text-decoration:none;color:var(--muted);font-weight:700;font-size:15px}
nav.links a:hover{color:var(--orange-ink)}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding-inline:18px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;border:1.5px solid transparent;white-space:nowrap;cursor:pointer}
.btn-orange{background:var(--orange);color:#1b1006}
.btn-orange:hover{filter:brightness(1.06)}
.btn-line{border-color:currentColor;color:inherit}
.btn svg{width:18px;height:18px}
/* البطل: لوحة مخطط هندسي */
.hero{background:var(--navy);color:var(--on-dark);position:relative;overflow:hidden;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:64px 72px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;letter-spacing:.02em;color:var(--orange)}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--orange)}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,52px);line-height:1.25;margin:14px 0 16px;text-wrap:balance}
.hero p.lead{color:var(--hero-muted);font-size:17.5px;max-width:58ch;white-space:pre-line}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.hero .btn-line{color:var(--on-dark)}
.plate{background:#fff;border-radius:18px;padding:26px;box-shadow:0 30px 60px -25px rgba(0,0,0,.55);position:relative}
.plate img{width:100%;height:auto;display:block}
.plate .stamp{position:absolute;inset-inline-start:-10px;bottom:-14px;background:var(--orange);color:#1b1006;font-weight:800;font-family:var(--display);font-size:13px;padding:6px 12px;border-radius:8px}
.facts{display:flex;gap:10px 22px;flex-wrap:wrap;margin-top:28px;font-size:14px;color:var(--hero-muted)}
.facts b{color:var(--on-dark);font-variant-numeric:tabular-nums}
/* الأقسام */
section{padding-block:64px}
.sec-head{display:flex;align-items:end;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.sec-head h2{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.2vw,34px);line-height:1.3}
.sec-head span{color:var(--muted)}
.services{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 18px 16px;display:flex;gap:12px;align-items:flex-start;font-weight:700;font-size:16.5px}
.svc i{flex:none;width:10px;height:10px;margin-top:10px;background:var(--orange);transform:rotate(45deg)}
.projects{display:grid;gap:0;border-top:2px solid var(--ink)}
.proj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px;padding:18px 4px;border-bottom:1px solid var(--line)}
.proj b{font-family:var(--display);font-weight:700;font-size:18px}
.proj span{color:var(--muted)}
.about-text{max-width:70ch;font-size:17.5px;white-space:pre-line}
.contact{background:var(--surface);border:1px solid var(--line);border-radius:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));overflow:hidden}
.contact>div{padding:20px 22px;border-inline-start:1px solid var(--line);display:grid;gap:2px}
.contact>div:first-child{border-inline-start:0}
.contact small{color:var(--muted);font-weight:700;font-size:13px}
.contact a,.contact b{font-weight:700;font-size:17px;text-decoration:none;overflow-wrap:anywhere}
.contact a:hover{color:var(--orange-ink)}
.ltr{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
footer{border-top:1px solid var(--line);padding-block:26px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;gap:12px 24px;flex-wrap:wrap;justify-content:space-between}
.soon{text-align:center;padding-block:90px}
.soon h1{font-family:var(--display);font-size:30px;margin:12px 0 6px}
.soon img{width:min(260px,70%);height:auto;background:#fff;border-radius:14px;padding:12px}
@media (max-width:820px){
  .hero .wrap{grid-template-columns:minmax(0,1fr);padding-block:44px 56px}
  .plate{max-width:340px}
  nav.links{display:none}
  .proj{grid-template-columns:minmax(0,1fr);gap:2px}
  .contact>div{border-inline-start:0;border-top:1px solid var(--line)}
  .contact>div:first-child{border-top:0}
  section{padding-block:46px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
